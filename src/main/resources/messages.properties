# 기본(한국어) 문구. 번역 파일(messages_en.properties 등)에 없는 키는 여기 값이 나간다.
# 에러 코드(STORE404-0 등)는 enum의 한국어를 기본값으로 쓰므로 여기에 다시 적지 않는다.
# 인자({0})가 있는 문구는 MessageFormat으로 읽혀 작은따옴표(')를 두 번('') 써야 한다

# 입력 검사 안내 (키: chat.input-guard.{안내 종류})
chat.input-guard.RESTRICTED=반복된 욕설로 채팅이 일시 제한되었습니다.
chat.input-guard.WARNED=원활한 상담을 위해 욕설을 제외하고 질문해 주세요. 최근 집계 기간 내 {0}회 감지되면 일시 제한됩니다.
chat.input-guard.REWRITE_REQUIRED=민감정보를 제외한 문의 내용을 입력해 주세요.
chat.input-guard.MASKED=민감정보를 가리고 문의를 처리합니다.

