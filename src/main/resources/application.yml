spring:
  application:
    name: telme
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:telme}
    username: ${POSTGRES_USER:telme}
    password: ${POSTGRES_PASSWORD:telme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
  show-actuator: false