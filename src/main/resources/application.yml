spring:
  application:
    name: telme
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:telme}
    username: ${POSTGRES_USER:telme}
    password: ${POSTGRES_PASSWORD:telme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    # db/migration: 스키마(항상 적용). db/dev-migration: 로컬 개발용 샘플 데이터(prod 프로파일에서는 제외).
    locations: classpath:db/migration,classpath:db/dev-migration
    # 운영 DB(AWS RDS)를 실수로 날리는 사고를 막기 위한 전역 안전장치. 로컬에서 스키마를 초기화하고
    # 싶으면 `podman-compose down -v`로 볼륨을 지우는 쪽을 쓰고, 이 값은 프로파일별로 풀지 않는다.
    clean-disabled: true

server:
  servlet:
    session:
      cookie:
        # 브라우저 기본값(SameSite 미지정 시 Lax 취급)에 기대지 않고 서버가 명시
        same-site: lax

springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
  show-actuator: false

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}

llm:
  # fake: Ollama 없이 고정 응답 / ollama: 로컬 EXAONE 호출
  provider: ${LLM_PROVIDER:fake}
  model: ${LLM_MODEL:exaone3.5:7.8b}
  connect-timeout: 5s
  read-timeout: 60s
  # 8192면 약 6GB를 쓰고 프롬프트·근거·이전 대화·출력이 모두 들어간다. 모델 자체는 32768까지 지원
  context-size: ${LLM_CONTEXT_SIZE:8192}
  retry:
    # 첫 토큰 전 실패에만 적용. 토큰이 나간 뒤 재시도하면 답이 중복된다
    max-attempts: 2
    wait-duration: 1s

embedding:
  model: ${EMBEDDING_MODEL:bge-m3}
  dimension: 1024
  connect-timeout: 5s
  search-read-timeout: 15s
  batch-read-timeout: 120s
  # 콜드 로드 방지 기동 시 워밍업. 기본 꺼짐 — 실제 배포 환경에서만 true로 켠다.
  warmup-enabled: ${EMBEDDING_WARMUP_ENABLED:false}

search:
  # 잠정값 — 무관 질문 유사도 분포 실측(2주차 임계값 캘리브레이션) 전까지의 임시 기준
  similarity-threshold: ${SEARCH_SIMILARITY_THRESHOLD:0.7}

telme:
  chat:
    pipeline:
      # 채팅 답변 파이프라인(ChatPipelineProcessor). false면 모든 질문이 AI_NOT_CONNECTED로 끝난다(장애 시 차단용).
      enabled: ${CHAT_PIPELINE_ENABLED:true}

member:
  guest:
    # 비회원 세션 유지 기간. guests.expires_at 계산에 사용.
    ttl: ${GUEST_TTL:30d}

faq:
  # 내부 검색 테스트 API(FaqSearchController). 로컬/개발 편의용, 운영에서는 반드시 꺼야 한다.
  search-test-api-enabled: ${FAQ_SEARCH_TEST_API_ENABLED:false}
  batch-load:
    # FAQ 배치 적재(FaqBatchLoadRunner). true로 기동하면 path의 JSON을 적재하고 exit-after면 종료
    # 이미 적재된 content_hash는 건너뛰므로 같은 파일을 다시 돌려도 안전
    enabled: ${FAQ_BATCH_LOAD_ENABLED:false}
    path: ${FAQ_BATCH_LOAD_PATH:scripts/data/faq_full_300.json}
    # embedBatch 1회 건수 = 트랜잭션 1개 건수
    # Ollama가 요청을 순차 처리하므로 50 상한
    batch-size: 50
    exit-after: true
