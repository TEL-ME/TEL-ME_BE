# 테스트 중 1분마다 도는 채팅 실행 타임아웃 정리가 다른 테스트 데이터를 건드리지 않도록 끈다.
chat.execution.timeout-scheduler-enabled=false
# 검색 점수 기록은 따로 커밋돼(REQUIRES_NEW) 테스트 롤백을 빠져나가 로컬·CI DB에 쌓이므로 끈다.
search.score-recording.enabled=false
# 되묻기는 답변 전에 모델을 한 번 더 부른다. 호출 횟수와 순서를 세는 테스트가 있어 테스트에서는 끈다.
telme.consult.faq-clarification.enabled=false

chat.input-guard.cleanup-enabled=false
# 회색 구간 판정은 기본 켜짐이지만 테스트는 실제 Bedrock을 부르지 않는다(비용, 결과가 실행마다 달라짐, CI에는 키가 없음).
# 회색 구간 동작은 가짜 판정기로 따로 확인한다(JudgingFaqGrayZoneSelectorTest, FaqSearchAnswerProviderTest)
search.gray-zone.enabled=false
llm.bedrock.enabled=false
# 테스트는 실제 Sentry로 오류를 보내지 않는다(개발자 PC에 SENTRY_DSN이 있어도 꺼둔다).
sentry.dsn=
# DSN이 비어 있어도 Sentry 자동 설정은 켜져서, 테스트 컨텍스트 캐시에서 밀려나 닫히는 컨텍스트가 전역 Sentry까지 닫는다.
# 수집을 확인하는 SentryErrorCaptureTest만 켜도록 나머지 테스트에서는 자동 설정을 뺀다
spring.autoconfigure.exclude=io.sentry.spring.boot.jakarta.SentryAutoConfiguration,io.sentry.spring.boot.jakarta.SentryLogbackAppenderAutoConfiguration
