plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.telme'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web · 검증
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// DB (JdbcTemplate은 data-jpa에 포함)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// 스키마 마이그레이션 (로컬 Docker Postgres · AWS RDS 공통)
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// pgvector: Hibernate 네이티브 vector 매핑 (버전은 Spring Boot의 hibernate.version과 반드시 동일하게 맞출 것)
	implementation 'org.hibernate.orm:hibernate-vector:6.6.53.Final'

	// 인증
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// 복원력 (타임아웃 · 재시도 · Bulkhead)
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// API 문서
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	// 모니터링
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 음성 합성·인식 (Amazon Polly, Transcribe)
	implementation platform('software.amazon.awssdk:bom:2.55.6')
	implementation 'software.amazon.awssdk:polly'
	// 검색 근거 판정 (Amazon Bedrock)
	implementation 'software.amazon.awssdk:bedrockruntime'
	// Bedrock 호출용 HTTP 클라이언트. 동시 연결 수·연결 대기 시간을 설정하려고 직접 둔다
	implementation 'software.amazon.awssdk:apache5-client'
	implementation 'software.amazon.awssdk:transcribestreaming'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트 (JUnit 5)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// @SpringBootTest 설정 조합마다 컨텍스트·HikariCP 풀이 따로 뜨는데, 기본 풀 크기(10)로는
	// 컨텍스트 수만 늘어도 Postgres max_connections(기본 100)를 넘을 수 있어 테스트 한정으로 줄인다
	systemProperty 'spring.datasource.hikari.maximum-pool-size', '3'
}
