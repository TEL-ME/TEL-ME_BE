// 명시적으로 실행할 때만 공유 검증 자료를 test source set에 추가한다.
allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('java')) {
            def suiteRoot = new File(project.rootDir, 'scripts/answer-guard-regression')
            project.sourceSets.test.java.srcDir(new File(suiteRoot, 'java'))
            project.sourceSets.test.resources.srcDir(new File(suiteRoot, 'resources'))
            project.tasks.named('test') {
                outputs.upToDateWhen { false }
                filter {
                    includeTestsMatching 'com.telme.rag.service.ComparisonEvidenceJudgeTest'
                    includeTestsMatching 'com.telme.rag.service.RagComparisonReviewTest'
                    includeTestsMatching 'com.telme.chat.service.AdminChatMonitoringStageSummarizerTest'
