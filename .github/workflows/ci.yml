name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write        # dorny/test-reporter 가 체크 런을 생성할 때 필요

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트가 DB에 접속하므로 로컬 docker-compose와 같은 이미지를 띄운다
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: telme
          POSTGRES_USER: telme
          POSTGRES_PASSWORD: telme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telme -d telme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: telme
      POSTGRES_USER: telme
      POSTGRES_PASSWORD: telme

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 아래 마이 이그레이션 검사에서 base 브랜치와 비교하려면 전체 이력 필요

      - name: 적용된 마이그레이션 수정 여부 검사
        if: github.event_name == 'pull_request'
        run: |
          bad=$(git diff --name-status --diff-filter=MD \
                  "origin/${{ github.base_ref }}...HEAD" \
                  -- src/main/resources/db/migration src/main/resources/db/dev-migration)
          if [ -n "$bad" ]; then
            echo "::error::이미 머지된 마이그레이션을 수정/삭제했습니다. 새 버전 파일을 추가하세요."
            echo "$bad"
            exit 1
          fi
          echo "OK - 기존 마이그레이션 변경 없음"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # services 컨테이너는 체크아웃 전에 기동되어 init 스크립트를 마운트할 수 없다.
      # 로컬 docker-compose 와 같은 SQL 파일을 실행해 확장을 맞춘다.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: psql -h localhost -p 5432 -U telme -d telme -f docker/postgres/init/01-extensions.sql

      - name: Build
        run: ./gradlew build --build-cache

      # 실패한 테스트를 PR 체크에서 바로 볼 수 있게 한다.
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
