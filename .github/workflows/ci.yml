name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트가 DB에 접속하므로 로컬 docker-compose와 같은 이미지를 띄운다
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: telme
          POSTGRES_USER: telme
          POSTGRES_PASSWORD: telme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telme -d telme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: telme
      POSTGRES_USER: telme
      POSTGRES_PASSWORD: telme

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # services 컨테이너는 체크아웃 전에 기동되어 init 스크립트를 마운트할 수 없다.
      # 로컬 docker-compose 와 같은 SQL 파일을 실행해 확장을 맞춘다.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: psql -h localhost -p 5432 -U telme -d telme -f docker/postgres/init/01-extensions.sql

      - name: Build
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
