name: Deploy

# develop의 CI가 통과하면 백엔드 이미지를 ECR에 올리고 앱 서버를 새 이미지로 교체
# 인프라(infra/terraform)를 apply하기 전에는 돌지 않게, 저장소 변수 DEPLOY_ENABLED=true일 때만 실행
# AWS 키는 쓰지 않는다. GitHub OIDC로 telme-github-deploy 역할을 빌린다(develop 브랜치만 허용)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

# 배포는 한 번에 하나씩. 진행 중인 배포는 끊지 않고 다음 배포가 기다린다
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC 토큰 발급

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::989624287827:role/telme-github-deploy
  ECR_REPOSITORY: telme-backend
  IMAGE_TAG_PARAMETER: /telme/prod/deploy/image_tag
  ASG_NAME: telme-app

jobs:
  deploy:
    # workflow_run의 branches 필터는 브랜치 이름만 본다. 포크에서 develop이라는 이름으로 PR을 열어도 걸리므로
    # 이 레포 develop에 push된 커밋의 CI만 배포한다
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run은 기본으로 develop의 최신 커밋을 받으므로, CI가 검사한 커밋을 정확히 받는다
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 이미지 태그(커밋 SHA)
        id: tag
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: AWS 자격 증명(OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR 태그는 덮어쓸 수 없다. 같은 커밋을 다시 배포하면 빌드를 건너뛴다
      - name: 이미 올린 이미지인지 확인
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.value == 'false'
        uses: docker/setup-buildx-action@v4

      # 앱 EC2는 x86_64(t3.large)라 amd64로 빌드한다
      - name: 이미지 빌드·push
        if: steps.exists.outputs.value == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 교체가 실패하면 되돌릴 수 있게 지금 태그를 먼저 남긴다
      - name: 이전 태그 확인
        id: previous
        run: |
          prev=$(aws ssm get-parameter --name "$IMAGE_TAG_PARAMETER" --query Parameter.Value --output text)
          echo "value=$prev" >> "$GITHUB_OUTPUT"
          echo "이전 태그 $prev"

      # 앱 EC2는 부팅할 때 이 파라미터의 태그로 이미지를 받는다
      - name: 배포할 태그 기록
        id: record
        run: |
          aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" \
            --value "${{ steps.tag.outputs.value }}" --overwrite

      # 새 서버를 먼저 띄우고 헬스 체크가 통과하면 옛 서버를 내린다.
      # Terraform의 instance_refresh 설정은 Terraform이 시작할 때만 쓰이므로 여기서 같은 값을 직접 준다
      # (주지 않으면 최소 정상 90%라 한 대 구성에서 옛 서버를 먼저 내릴 수 있다)
      - name: Instance Refresh 시작
        id: refresh
        run: |
          id=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" \
                 --strategy Rolling \
                 --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":600}' \
                 --query InstanceRefreshId --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Instance Refresh $id"

      # 첫 부팅에 Docker 설치·모델 다운로드가 있어 10분 넘게 걸릴 수 있다
      - name: 교체 완료 대기
        run: |
          for _ in $(seq 1 70); do
            status=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" \
                       --instance-refresh-ids "${{ steps.refresh.outputs.id }}" \
                       --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' --output text)
            echo "$(date +%H:%M:%S) $status"
            case "$status" in
              Successful*) exit 0 ;;
              Failed*|Cancelled*|RollbackSuccessful*|RollbackFailed*)
                echo "::error::Instance Refresh 실패: $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::35분 안에 끝나지 않아 교체를 멈추고 이전 태그로 되돌린다"
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" || true
          exit 1

      # 실패한 태그가 남으면 이후 헬스 체크 교체나 자동 확장으로 뜨는 서버가 실패한 이미지를 다시 받는다.
      # 최소 정상 100%라 옛 서버는 남아 있고, 실패한 새 서버는 ASG가 내린 뒤 되돌린 태그로 다시 띄운다
      - name: 실패 시 이전 태그로 되돌리기
        if: failure() && steps.record.outcome == 'success' && steps.previous.outputs.value != ''
        run: |
          aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" \
            --value "${{ steps.previous.outputs.value }}" --overwrite
          echo "::warning::이미지 태그를 ${{ steps.previous.outputs.value }}로 되돌렸다"

      - name: 요약
        if: always()
        run: |
          {
            echo "### 백엔드 배포"
            echo "- 커밋: \`${{ steps.tag.outputs.value }}\`"
            echo "- 이전 태그: \`${{ steps.previous.outputs.value }}\`"
            echo "- 이미지 새로 빌드: ${{ steps.exists.outputs.value == 'false' }}"
            echo "- Instance Refresh: \`${{ steps.refresh.outputs.id }}\`"
            echo "- 결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
