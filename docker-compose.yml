# 로컬 개발 환경
# 실행: docker compose up -d
# 값은 .env 에서 읽고, 없으면 아래 기본값을 사용한다 (application.yml 기본값과 동일)
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: telme-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telme}
      POSTGRES_USER: ${POSTGRES_USER:-telme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telme}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telme} -d ${POSTGRES_DB:-telme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 선택 실행: docker compose --profile ollama up -d
  # Mac은 Docker 안에서 GPU를 쓰지 못해 CPU로만 동작한다.
  # 속도가 필요하면 Ollama 앱을 직접 설치하고 이 서비스는 띄우지 않는다. (포트 11434 충돌 주의)
  ollama:
    image: ollama/ollama:0.34.0
    container_name: telme-ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
