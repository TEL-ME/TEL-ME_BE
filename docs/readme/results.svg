<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">측정으로 정한 결정</title>
  <desc id="d">라우팅, 검색, 근거 판정, 답변 생성, 되묻기, 문맥 해석, 장애 대체를 바꾸기 전과 후의 측정값.</desc>
  <style>
    text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #2B262D; }
    .title { font-size: 24px; font-weight: 800; }
    .sub { font-size: 15px; fill: #6B6470; }
    .cat { font-size: 12.5px; font-weight: 800; fill: #C34074; }
    .name { font-size: 15.5px; font-weight: 800; }
    .big { font-size: 36px; font-weight: 800; fill: #C34074; }
    .unit { font-size: 16px; font-weight: 700; fill: #9A929D; }
    .was { font-size: 14px; fill: #6B6470; }
    .wasv { font-size: 14px; font-weight: 800; fill: #6B6470; }
    .cond { font-size: 12.5px; fill: #8A838D; }
    .low { font-size: 11.5px; font-weight: 800; fill: #FFFFFF; }
    .foot { font-size: 13px; fill: #6B6470; }
  </style>
  <rect x="1" y="1" width="1198" height="558" rx="22" fill="#FFFFFF" stroke="#E6E1E7" stroke-width="2"/>
  <text x="40" y="54" class="title">감이 아니라 측정으로 정했다</text>
  <text x="40" y="82" class="sub">평가셋을 고정하고, 설정·모델을 바꿀 때마다 같은 조건으로 다시 잰 값</text>
  <g>
    <rect x="40" y="108" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="60" y="138" class="cat">라우팅</text>
    <text x="60" y="164" class="name">의도 분류 일치</text>
    <text x="60" y="218" class="big">360~362<tspan class="unit" dx="6">/365</tspan></text>
    <text x="60" y="248" class="was">이전 <tspan class="wasv">337</tspan></text>
    <line x1="60" y1="262" x2="288" y2="262" stroke="#ECE8EE"/>
    <text x="60" y="282" class="cond">EXAONE → gpt-oss · 3회</text>
  </g>
  <g>
    <rect x="324" y="108" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="344" y="138" class="cat">검색</text>
    <text x="344" y="164" class="name">정답이 후보 3개 안 (Recall@3)</text>
    <text x="344" y="218" class="big">0.463</text>
    <text x="344" y="248" class="was">이전 <tspan class="wasv">0.375</tspan></text>
    <line x1="344" y1="262" x2="572" y2="262" stroke="#ECE8EE"/>
    <text x="344" y="282" class="cond">단일 → 이중 벡터 · 80문항</text>
  </g>
  <g>
    <rect x="608" y="108" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="628" y="138" class="cat">근거 판정</text>
    <text x="628" y="164" class="name">정답 근거를 찾은 수</text>
    <text x="628" y="218" class="big">74<tspan class="unit" dx="6">/110</tspan></text>
    <text x="628" y="248" class="was">이전 <tspan class="wasv">61</tspan></text>
    <line x1="628" y1="262" x2="856" y2="262" stroke="#ECE8EE"/>
    <text x="628" y="282" class="cond">판정기 없음 → 있음 · 채팅 API</text>
  </g>
  <g>
    <rect x="892" y="108" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="912" y="138" class="cat">근거 판정</text>
    <rect x="1056" y="124" width="86" height="22" rx="11" fill="#2B262D"/>
    <text x="1099" y="139.5" class="low" text-anchor="middle">낮을수록 좋음</text>
    <text x="912" y="164" class="name">엉뚱한 근거로 답한 수</text>
    <text x="912" y="218" class="big">2<tspan class="unit" dx="6">/68</tspan></text>
    <text x="912" y="248" class="was">이전 <tspan class="wasv">10</tspan></text>
    <line x1="912" y1="262" x2="1140" y2="262" stroke="#ECE8EE"/>
    <text x="912" y="282" class="cond">답이 없는 질문 · 채팅 API</text>
  </g>
  <g>
    <rect x="40" y="310" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="60" y="340" class="cat">답변 생성</text>
    <text x="60" y="366" class="name">답변 통과율 (Judge 3종)</text>
    <text x="60" y="420" class="big">73~74%</text>
    <text x="60" y="450" class="was">이전 <tspan class="wasv">43%</tspan></text>
    <line x1="60" y1="464" x2="288" y2="464" stroke="#ECE8EE"/>
    <text x="60" y="484" class="cond">EXAONE → gpt-oss · 217개</text>
  </g>
  <g>
    <rect x="324" y="310" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="344" y="340" class="cat">되묻기</text>
    <text x="344" y="366" class="name">조건 뽑기 정확도</text>
    <text x="344" y="420" class="big">72~81%</text>
    <text x="344" y="450" class="was">이전 <tspan class="wasv">22%</tspan></text>
    <line x1="344" y1="464" x2="572" y2="464" stroke="#ECE8EE"/>
    <text x="344" y="484" class="cond">EXAONE → gpt-oss · 32건 · 3회</text>
  </g>
  <g>
    <rect x="608" y="310" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="628" y="340" class="cat">문맥 해석</text>
    <text x="628" y="366" class="name">앞 대화 이어 묻기</text>
    <text x="628" y="420" class="big">19<tspan class="unit" dx="6">/30</tspan></text>
    <text x="628" y="450" class="was">이전 <tspan class="wasv">1</tspan></text>
    <line x1="628" y1="464" x2="856" y2="464" stroke="#ECE8EE"/>
    <text x="628" y="484" class="cond">규칙 보완 전 → 후 · 10건 × 3회</text>
  </g>
  <g>
    <rect x="892" y="310" width="268" height="186" rx="16" fill="#F8F6F9" stroke="#ECE8EE"/>
    <text x="912" y="340" class="cat">장애 대체</text>
    <rect x="1056" y="326" width="86" height="22" rx="11" fill="#2B262D"/>
    <text x="1099" y="341.5" class="low" text-anchor="middle">낮을수록 좋음</text>
    <text x="912" y="366" class="name">장애 시 턴 시간 p95</text>
    <text x="912" y="420" class="big">8.8초</text>
    <text x="912" y="450" class="was">이전 <tspan class="wasv">27.6초</tspan></text>
    <line x1="912" y1="464" x2="1140" y2="464" stroke="#ECE8EE"/>
    <text x="912" y="484" class="cond">Ollama → vLLM · 동시 대화 5개</text>
  </g>
  <text x="40" y="538" class="foot">각 수치의 평가셋·조건·문서는 아래 표에 있다. 실제 고객 대화가 아니라 고정한 평가 문장으로 잰 값이다.</text>
</svg>
